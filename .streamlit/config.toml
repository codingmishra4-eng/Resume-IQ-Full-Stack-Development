# Streamlit theme baseline (custom CSS in frontend/styles.py adds the premium layer)
[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#111820"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
address = "localhost"
port = 8501

[browser]
gatherUsageStats = false
