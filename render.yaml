# Preparation only: importing this Blueprint creates infrastructure; operator approval required.
services:
  - type: web
    name: resumeiq-api
    runtime: python
    branch: codex/phase-5-production-readiness
    plan: standard
    buildCommand: pip install --no-cache-dir -r requirements-api.txt
    startCommand: python -m scripts.start_api
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: CLOUD_ENABLED
        value: "true"
      - key: API_PUBLIC_MODE
        value: "true"
      - key: API_LEGACY_UPLOAD_ENABLED
        value: "false"
      - key: CLOUD_AI_ENABLED
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: CLOUD_DB_POOL_SIZE
        value: "3"
      - key: CLOUD_DB_MAX_OVERFLOW
        value: "1"
      - key: CLOUD_DB_POOL_TIMEOUT
        value: "5"
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: CLOUD_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_ALGORITHM
        value: ES256
      - key: SUPABASE_STORAGE_BUCKET
        value: resumes
      - key: SUPABASE_SECRET_KEY
        sync: false
